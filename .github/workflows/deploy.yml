name: Build and Deploy App Dream
on:
  push:
    branches:
      - iac-deploy-new

jobs:
  provision-infra:
    name: Provision AWS Infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.4

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan -out=plan.tfplan

      - name: Terraform Apply
        working-directory: terraform
        run: terraform apply -auto-approve plan.tfplan

      - id: get-outputs
        working-directory: terraform
        run: |
          echo "ec2_ip=$(terraform output -raw ec2_public_ip)" >> $GITHUB_OUTPUT
          echo "ec2_key=$(terraform output -raw ec2_private_key)" >> $GITHUB_OUTPUT
    outputs:
      ec2_ip: ${{ steps.get-outputs.outputs.ec2_ip }}
      ec2_key: ${{ steps.get-outputs.outputs.ec2_key }}

  # … your build-backend and build-frontend jobs remain unchanged …

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [provision-infra, build-backend, build-frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Save Terraform Key to File
        run: |
          echo "${{ needs.provision-infra.outputs.ec2_key }}" > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Copy docker-compose.yml to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ needs.provision-infra.outputs.ec2_ip }}
          username: ubuntu
          key: ec2-key.pem
          source: "docker-compose.yml"
          target: "/home/ubuntu/app/"

      - name: Deploy on EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.provision-infra.outputs.ec2_ip }}
          username: ubuntu
          key: ec2-key.pem
          script: |
            set -e
            mkdir -p /home/ubuntu/app
            cd /home/ubuntu/app
            echo "Creating .env file"
            echo "BACKEND_IMAGE=${{ secrets.DOCKER_USERNAME }}/dream-backend:${{ github.sha }}" > .env
            echo "FRONTEND_IMAGE=${{ secrets.DOCKER_USERNAME }}/dream-frontend:${{ github.sha }}" >> .env
            echo "DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}" >> .env
            echo "POSTGRES_USER=${{ secrets.POSTGRES_USER }}" >> .env
            echo "POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}" >> .env
            echo "POSTGRES_DB=${{ secrets.POSTGRES_DB }}" >> .env
            echo "POSTGRES_PORT=5432" >> .env
            echo "REACT_APP_API_URL=http://${{ needs.provision-infra.outputs.ec2_ip }}:3001" >> .env
            echo "COUNTRIES_API_BASE_URL=https://restcountries.com/v3.1" >> .env

            docker login -u ${{ secrets.DOCKER_USERNAME }} -p ${{ secrets.DOCKER_TOKEN }}
            docker-compose -p app pull
            docker-compose -p app up -d
            docker ps -a

      - name: Check Container Health
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ needs.provision-infra.outputs.ec2_ip }}
          username: ubuntu
          key: ec2-key.pem
          script: |
            set -e
            cd /home/ubuntu/app
            for i in {1..30}; do
              if curl -s http://localhost:80 >/dev/null; then
                echo "Frontend is up"
                break
              fi
              echo "Waiting for frontend..."
              sleep 2
            done
            for i in {1..30}; do
              if curl -s http://localhost:3001 >/dev/null; then
                echo "Backend is up"
                break
              fi
              echo "Waiting for backend..."
              sleep 2
            done
            docker ps -a
            docker logs app-db-1 || true
            docker logs app-backend-1 || true
            docker logs app-frontend-1 || true